<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブログ</title>
    <style>
        :root {
            --panel-bg: #ffffff;          /* 基本のパネル背景 */
            --text-main: #1a252f;         /* より濃くハッキリしたチャコール */
            --text-muted: #555555;        /* 薄すぎない、しっかり読めるグレー */
            --border-color: #b0a99f;      /* 枠線を太く・濃くして境界を明瞭に */
            --danger-color: #c0392b;      /* 落ち着いたワインレッド */

            /* 初期値（Classic Gold） */
            --bg-color: #fcfbf9;
            --accent-color: #a0522d;
            --accent-hover: #8b4513;
        }

        /* --- メリハリがあり区別しやすい10種類のエレガントなテーマ定義 --- */
        body.theme-classic { --bg-color: #fcfbf9; --accent-color: #a0522d; --accent-hover: #8b4513; } /* シエナブラウン */
        body.theme-green   { --bg-color: #f2f7f4; --accent-color: #1e5631; --accent-hover: #143d22; } /* フォレストグリーン */
        body.theme-blue    { --bg-color: #f0f5fa; --accent-color: #1a4a75; --accent-hover: #103250; } /* ディープブルー */
        body.theme-red     { --bg-color: #faf2f2; --accent-color: #8b0000; --accent-hover: #5a0000; } /* ダークレッド */
        body.theme-pink    { --bg-color: #fdf5f7; --accent-color: #b33951; --accent-hover: #8c2639; } /* ローズマゼンタ */
        body.theme-purple  { --bg-color: #f6f3f8; --accent-color: #5d317c; --accent-hover: #43205b; } /* ロイヤルパープル */
        body.theme-amber   { --bg-color: #fcf7f2; --accent-color: #c25c0e; --accent-hover: #964303; } /* ディープアンバー */
        body.theme-teal    { --bg-color: #f0f7f7; --accent-color: #006666; --accent-hover: #004d4d; } /* ディープティール */
        body.theme-gray    { --bg-color: #f5f6f6; --accent-color: #4a5568; --accent-hover: #2d3748; } /* スレートグレー */
        body.theme-dark    { --bg-color: #eef0f1; --accent-color: #2c3e50; --accent-hover: #1a252f; } /* ミッドmidnightブラック */

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Meiryo", sans-serif;
            color: var(--text-main);
            font-weight: 500;
            margin: 0;
            padding: 20px 10px 40px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            letter-spacing: 0.05em;
            transition: background-color 0.4s ease;
        }

        /* ノート切り替えタブ */
        .notebook-tabs-container {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .notebook-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 2px;
            background-color: var(--border-color);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        .notebook-tab {
            padding: 15px 15px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            background-color: var(--panel-bg);
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            box-sizing: border-box;
            min-width: 0;
        }
        .notebook-tab:hover {
            background-color: #f5f3ef;
            color: var(--text-main);
        }
        .notebook-tab.active {
            background-color: #fff;
            color: var(--text-main);
            font-weight: 800;
            box-shadow: inset 0 -4px 0 var(--accent-color);
        }
        .notebook-tab-add {
            background-color: #f5f3ef;
            color: var(--text-main);
            justify-content: center;
        }
        .notebook-tab-add:hover {
            background-color: #e5e2db;
        }
        .notebook-tab-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            margin-right: 5px;
        }
        .notebook-tab-rename-btn {
            font-size: 0.85rem;
            color: var(--accent-color);
            background: none;
            border: none;
            padding: 2px 4px;
            width: auto;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 現在の日記帳名とテーマ設定エリア */
        .notebook-header-panel {
            width: 100%;
            max-width: 1200px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 15px 25px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .current-notebook-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .announcement-content {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.8;
            color: var(--text-main);
        }
        .announcement-content a {
            color: var(--accent-color);
            font-weight: 700;
        }
        .announcement-content img {
            max-width: 100%;
            max-height: 300px;
            display: block;
            margin: 10px 0;
            border-radius: 4px;
        }
        .announcement-content p {
            margin: 0 0 10px 0;
        }
        .announcement-content p:last-child {
            margin-bottom: 0;
        }
        .theme-selector-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            flex-wrap: wrap;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 20px auto;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 15px 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }
        .theme-selector-item {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 0;
            min-width: 130px;
        }
        .theme-selector-item span {
            display: none;
        }
        .theme-selector-wrapper select,
        .theme-selector-wrapper button {
            width: 100%;
            height: 38px;
            padding: 0 12px;
            font-weight: 600;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 0;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .theme-selector-item-auto {
            flex: 0 0 auto;
        }
        .theme-selector-wrapper #viewModeToggleBtn {
            width: auto;
            font-size: 0.85rem;
            padding: 0 16px;
        }

        /* 全体コンテナ */
        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .main-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 0;
        }

        @media (min-width: 992px) {
            .container {
                grid-template-columns: 290px 1fr 290px;
                align-items: start;
            }
            .sidebar-left, .sidebar-right {
                position: sticky;
                top: 20px;
            }
            .container.demo-mode {
                grid-template-columns: 290px 1fr;
            }
        }

        .notebook-panel {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .notebook-panel.history-panel {
            margin-top: 20px;
        }

        h2, h3 {
            margin-top: 0;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.1em;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        #indexHeader, #mgmtHeader {
            text-align: center;
        }
        /* SETTINGセクションの英語表記は小文字のまま表示する(他の見出しは大文字化する仕様のため個別に無効化) */
        #mgmtActions button, #announcementEditBtn {
            text-transform: none;
        }

        .editable-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-color);
            display: inline-block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .form-group { margin-bottom: 25px; }

        .form-note {
            display: block;
            font-size: 0.8rem;
            color: var(--danger-color);
            margin-top: 4px;
            font-weight: 600;
        }

        .file-size-badge {
            display: inline-block;
            color: var(--text-muted);
            padding: 2px 0;
            font-size: 0.75rem;
            margin-top: 2px;
            font-weight: 500;
            letter-spacing: 0.02em;
            opacity: 0.85;
        }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            background-color: #faf9f6;
            box-sizing: border-box;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            font-family: inherit;
            transition: all 0.3s;
        }
        input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #fff;
        }

        textarea { height: 180px; resize: vertical; line-height: 1.8; font-weight: 500; }

        .weather-input-container {
            display: flex;
            gap: 10px;
        }
        .weather-input-container select {
            flex: 1;
        }
        .weather-input-container input[type="text"] {
            flex: 1;
        }

        .image-preview-area {
            border: 2px dashed var(--border-color);
            padding: 20px;
            text-align: center;
            background-color: #faf9f6;
            cursor: pointer;
            font-weight: 600;
            transition: border-color 0.2s;
            margin-bottom: 15px;
            color: var(--text-muted);
        }
        .image-preview-area:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }
        
        .form-images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .form-image-item {
            display: flex;
            flex-direction: column;
            background-color: #faf9f6;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            box-sizing: border-box;
            position: relative;
        }
        .form-image-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .diary-view-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        .diary-view-image-wrapper {
            background-color: #faf9f6;
            padding: 15px;
            border: 2px solid var(--border-color);
            text-align: center;
        }
        .diary-view-image-wrapper img {
            max-width: 100%;
            max-height: 400px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        /* お知らせの画像は、文字エリア(notebook-header-panel)と一体化するよう縁取り・背景色を消す */
        #announcementContent .diary-view-image-wrapper {
            background-color: var(--panel-bg);
            border: none;
            padding: 0;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            text-transform: uppercase;
        }
        button:hover { background-color: var(--accent-hover); }

        .backup-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            margin-bottom: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .backup-btn:hover { background-color: #faf9f6; }
        #mgmtActions .backup-btn {
            font-size: 0.78rem;
            padding: 10px 8px;
        }
        
        .new-post-btn { background-color: var(--text-main); margin-bottom: 25px; font-size: 1rem;}
        .new-post-btn:hover { background-color: #000000; }
        
        .file-input-label {
            display: block;
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 10px 15px;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-input-label:hover { background-color: #faf9f6; }
        #mgmtActions .file-input-label {
            font-size: 0.78rem;
            padding: 10px 8px;
        }

        .announcement-image-btn-row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }
        .announcement-image-btn-row .file-input-label {
            flex: 1 1 0;
            min-width: 0;
            margin-bottom: 0;
            font-size: 0.68rem;
            padding: 10px 2px;
        }
        .announcement-image-btn-row .file-input-label span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .index-list, .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .index-list { max-height: none; overflow-y: visible; }
        .index-group { margin-bottom: 25px; }

        .index-page-size-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .index-page-size-row select {
            width: auto;
            padding: 4px 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .index-page-nav, .entry-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .index-page-nav:empty, .entry-nav:empty { display: none; }
        .index-page-nav button, .entry-nav button {
            width: auto;
            flex: 1;
            background-color: transparent;
            color: var(--text-main);
            border: none;
            padding: 4px 10px;
            font-size: 1.1rem;
            line-height: 1;
            font-weight: 700;
        }
        .index-page-nav button:hover, .entry-nav button:hover { color: var(--accent-color); }
        .index-page-nav button:disabled, .entry-nav button:disabled { opacity: 0.3; cursor: default; }
        .index-page-nav button:disabled:hover, .entry-nav button:disabled:hover { color: var(--text-main); }
        .index-page-nav .index-page-status {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .entry-nav { margin: 15px 0; }

        .feed-entry-block {
            padding-bottom: 30px;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--border-color);
        }
        .feed-entry-block:last-child {
            padding-bottom: 0;
            margin-bottom: 0;
            border-bottom: none;
        }

        .index-item, .history-item {
            padding: 12px 14px;
            background-color: #faf9f6;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .index-item:hover, .index-item.active, .history-item:hover {
            background-color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }
        .index-item.active {
            border-left: 6px solid var(--accent-color);
        }
        .index-row-top, .history-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }
        .index-page-num, .history-notebook-name {
            color: var(--accent-color);
        }
        .index-row-bottom, .history-row-bottom {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-top: 2px;
        }
        .index-row-bottom.empty-title, .history-row-bottom.empty-title {
            color: #b0a99f;
            font-size: 0.85rem;
            font-style: italic;
        }

        .public-toggle-btn {
            width: auto;
            padding: 2px;
            background-color: transparent;
            border: none;
            color: #b0a99f;
            opacity: 0.7;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .public-toggle-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .public-toggle-btn.is-public {
            color: var(--accent-color);
            opacity: 1;
        }
        .public-toggle-btn:hover { opacity: 1; }

        .bulk-public-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .bulk-public-actions button {
            font-size: 0.75rem;
            padding: 8px 10px;
        }

        /* フォントサイズ設定(小・中・大)は entry-view-wrapper 全体(タイトル・日付/天気・本文)に適用する */
        .entry-view-wrapper.fontsize-small { font-size: 14px; }
        .entry-view-wrapper.fontsize-medium { font-size: 16px; }
        .entry-view-wrapper.fontsize-large { font-size: 19px; }

        .diary-view-title {
            font-size: 1.25em;
            font-weight: 700;
            color: var(--text-main);
            margin: -5px 0 15px 0;
            padding-bottom: 2px;
        }

        .diary-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 1em;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }
        .diary-view-header.vertical {
            justify-content: center;
            gap: 20px;
        }
        .diary-view-text {
            font-size: 1.05em;
            font-weight: 500;
            line-height: 2;
            white-space: pre-wrap;
            color: var(--text-main);
            min-height: 150px;
        }

        .diary-view-text.vertical {
            writing-mode: vertical-rl;
            -webkit-writing-mode: vertical-rl;
            letter-spacing: 0.1em;
            line-height: 2.2;
            height: 400px;
            max-height: 70vh;
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            padding: 10px 0;
            font-family: "Georgia", "Hiragino Mincho ProN", "BIZ UDMincho", serif;
            box-sizing: border-box;
            border-right: 1px dashed var(--border-color);
        }

        .action-buttons {
            display: flex;
            justify-content: flex-start;
            gap: 15px;
            margin-top: 40px;
            border-top: 2px solid var(--border-color);
            padding-top: 20px;
        }
        .delete-btn { background-color: transparent; color: var(--text-muted); border: 2px solid var(--border-color); padding: 8px 16px; font-size: 0.85rem; font-weight: 600; width: auto; }
        .delete-btn:hover { background-color: #fff1f0; color: var(--danger-color); border-color: var(--danger-color); }
        .edit-entry-btn { background-color: transparent; color: var(--accent-color); border: 2px solid var(--accent-color); padding: 8px 16px; font-size: 0.85rem; font-weight: 700; width: auto; }
        .edit-entry-btn:hover { background-color: var(--accent-color); color: white; }

        /* カレンダー */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .calendar-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .calendar-era {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .calendar-western {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .calendar-nav-btn {
            background: none;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 12px;
            width: auto;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .calendar-nav-btn:hover { background-color: #faf9f6; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .calendar-day-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 4px;
        }
        .calendar-cell {

<script>
    // --- IndexedDB & localStorage ハイブリッド管理システム ---
    const DB_NAME = "ChronicleAppDB";
    const DB_VERSION = 1;
    let db = null;
    let isIndexedDBAvailable = false;

    function initDB() {
        return new Promise((resolve) => {
            try {
                // Safariのローカル実行制限チェックを兼ねる
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = function(e) {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains("app_state")) {
                        database.createObjectStore("app_state");
                    }
                };
                request.onsuccess = function(e) {
                    db = e.target.result;
                    isIndexedDBAvailable = true;
                    console.log("Database: IndexedDB モードで起動しました。");
                    resolve();
                };
                request.onerror = function() {
                    console.warn("Database: IndexedDB の起動がブロックされました。localStorage モードへ切り替えます。");
                    isIndexedDBAvailable = false;
                    resolve();
                };
            } catch (e) {
                console.warn("Database: IndexedDB 例外エラーのため localStorage モードで起動します。");
                isIndexedDBAvailable = false;
                resolve();
            }
        });
    }

    function getDBValue(key, defaultValue) {
        if (!isIndexedDBAvailable) {
            const val = localStorage.getItem('chronicle_v3_' + key);
            return Promise.resolve(val !== null ? JSON.parse(val) : defaultValue);
        }
        return new Promise((resolve) => {
            const transaction = db.transaction(["app_state"], "readonly");
            const store = transaction.objectStore("app_state");
            const request = store.get(key);
            request.onsuccess = function() {
                resolve(request.result !== undefined ? request.result : defaultValue);
            };
            request.onerror = function() {
                resolve(defaultValue);
            };
        });
    }

    function setDBValue(key, value) {
        if (!isIndexedDBAvailable) {
            localStorage.setItem('chronicle_v3_' + key, JSON.stringify(value));
            return Promise.resolve();
        }
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(["app_state"], "readwrite");
            const store = transaction.objectStore("app_state");
            const request = store.put(value, key);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    function clearDB() {
        if (!isIndexedDBAvailable) {
            // 前のバージョンや別キーに影響が出ないよう、接頭辞付きデータのみ削除
            localStorage.removeItem('chronicle_v3_notebooks');
            localStorage.removeItem('chronicle_v3_current_nb_id');
            localStorage.removeItem('chronicle_v3_edit_history');
            return Promise.resolve();
        }
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(["app_state"], "readwrite");
            const store = transaction.objectStore("app_state");
            const request = store.clear();
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    // 公開マーク切替ボタン用アイコン(公開中/非公開)。fill="currentColor" にしてCSS側の color で色を制御する。
    const ICON_PUBLIC_ON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M324-111.5Q251-143 197-197t-85.5-127Q80-397 80-480t31.5-156Q143-709 197-763t127-85.5Q397-880 480-880t156 31.5Q709-817 763-763t85.5 127Q880-563 880-480t-31.5 156Q817-251 763-197t-127 85.5Q563-80 480-80t-156-31.5ZM437-141v-82q-35 0-59-26t-24-61v-44L149-559q-5 20-7 39.5t-2 39.5q0 130 84.5 227T437-141Zm294-108q44-48 66.5-107.5T820-480q0-106-58-192.5T607-799v18q0 35-24 61t-59 26h-87v87q0 17-13.5 28T393-568h-83v88h258q17 0 28 13t11 30v127h43q29 0 51 17t30 44Z"/></svg>';
    const ICON_PUBLIC_OFF = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M833-41 717-157q-50 37-110 57T480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-67 20-127t57-110L26-848l43-43L876-84l-43 43ZM437-141v-82q-35 0-59-26t-24-61v-44L149-559q-5 20-7 39.5t-2 39.5q0 130 84.5 227T437-141Zm366-102-43-43q29-43 44.5-92.5T820-480q0-106-58-192.5T607-799v18q0 35-24 61t-59 26h-87v85L243-803q50-37 110-57t127-20q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 67-20 127t-57 110Z"/></svg>';

    // --- アプリケーション変数群 ---
    let notebooks = [];
    let currentNotebookId = 'nb_default';
    let editHistory = [];
    let labels = {};
    let currentSelectId = null;
    let currentFormDate = null;
    let tempImagesArray = [];
    let siteAnnouncement = { content: '', images: [], isPublic: false };
    let announcementTempImages = [];

    // お知らせ本文(HTML)の中に直接埋め込まれたbase64画像タグを抽出し、本文とは別の配列に分離する。
    function extractImagesFromAnnouncementContent(content) {
        const images = [];
        const imgTagPattern = /<img[^>]*src="(data:[^"]+)"[^>]*>\n?/g;
        const text = content.replace(imgTagPattern, (match, dataUrl) => {
            images.push({ id: Date.now() + Math.random(), data: dataUrl });
            return '';
        });
        return { text, images };
    }

    // お知らせの本文と画像を組み立てて表示用HTMLにする(プレビュー・公開ページ・書き出し共通)
    function composeAnnouncementHtml(announcement) {
        if (!announcement) return '';
        let galleryHtml = '';
        if (announcement.images && announcement.images.length > 0) {
            galleryHtml = '<div class="diary-view-gallery">';
            announcement.images.forEach(img => {
                const src = typeof img === 'string' ? img : img.data;
                galleryHtml += `<div class="diary-view-image-wrapper"><img src="${src}"></div>`;
            });
            galleryHtml += '</div>';
        }
        return `${galleryHtml}${announcement.content || ''}`;
    }
    let indexPageSize = 5;
    let indexPageOffset = 0;
    let mainViewMode = 'feed'; // 'single'(1件詳細表示) または 'feed'(ページ単位でまとめて表示)

    let calendarYear = new Date().getFullYear();
    let calendarMonth = new Date().getMonth();

    // ============================================================
    // ⚠️ 【このコードをフォーク/ダウンロードして使う方へ】⚠️
    // ============================================================
    // 以下の LIVE_DEMO_HOSTNAME は、このアプリの作者(puipui)自身の
    // 公開ページ(https://ocoe-puipui.github.io/diary/)専用の設定です。
    // 一致した場合のみ、新規作成・編集・削除・公開切替などの機能を隠す
    // 「閲覧専用デモモード」に切り替わります。
    //
    // ご自身の環境で使う場合は、この値は無関係(常にfalseになる)なので
    // そのままでも動作はしますが、紛らわしいため以下のいずれかの対応を
    // 強く推奨します。
    //   1) 単純に削除する(このブロックと isLiveDemo の分岐処理ごと削除)
    //   2) ご自身の公開ドメインに書き換える(例: 'yourname.github.io')
    //      → ご自身のサイトでも同様に「公開部分は編集不可にしたい」場合はこちら
    //
    // このままにしておいても他人の環境情報が漏れるようなことはありません
    // (単なる文字列比較です)が、「保護されているつもりが実は無効」という
    // 誤解を避けるため、必ずご自身の用途に合わせて見直してください。
    // ============================================================
    const LIVE_DEMO_HOSTNAME = 'ocoe-puipui.github.io';
    const isLiveDemo = (location.hostname === LIVE_DEMO_HOSTNAME);

    window.onload = async function() {
        if (isLiveDemo) {
            await initReadOnlyDemo();
            return;
        }
        await initDB();
        
        // 旧データ互換処理（localStorageからのサルベージ）
        let oldNotebooks = localStorage.getItem('chronicle_notebooks');
        if (oldNotebooks && isIndexedDBAvailable) {
            try {
                await setDBValue("notebooks", JSON.parse(oldNotebooks));
                await setDBValue("current_nb_id", localStorage.getItem('chronicle_current_nb_id') || 'nb_default');
                await setDBValue("edit_history", JSON.parse(localStorage.getItem('chronicle_edit_history') || '[]'));
                localStorage.removeItem('chronicle_notebooks');
                localStorage.removeItem('chronicle_current_nb_id');
                localStorage.removeItem('chronicle_edit_history');
            } catch(err){ console.error("データ移行失敗", err); }
        }

        notebooks = await getDBValue("notebooks", [
            { id: 'nb_default', name: '日記1', theme: 'theme-classic', isVertical: false, entries: [] }
        ]);
        currentNotebookId = await getDBValue("current_nb_id", 'nb_default');
        editHistory = await getDBValue("edit_history", []);
        siteAnnouncement = await getDBValue("site_announcement", { content: '', images: [], isPublic: false });
        if (!siteAnnouncement.images) siteAnnouncement.images = [];
        // 旧バージョンで本文(HTML)に直接埋め込まれていたbase64画像を、別フィールド(images)に分離する。
        // 巨大な文字列がそのままテキストエリアに入ると編集画面を開くたびに固まってしまうため、一度だけ移行する。
        const migrated = extractImagesFromAnnouncementContent(siteAnnouncement.content || '');
        if (migrated.images.length > 0) {
            siteAnnouncement.content = migrated.text;
            siteAnnouncement.images = [...siteAnnouncement.images, ...migrated.images];
            await setDBValue("site_announcement", siteAnnouncement);
        }

        if (!notebooks.find(nb => nb.id === currentNotebookId)) {
            currentNotebookId = notebooks[0].id;
        }

        // データの整合性チェックと自動補完
        notebooks.forEach(nb => {
            if (!nb.theme) nb.theme = 'theme-classic';
            if (nb.isVertical === undefined) nb.isVertical = false;
            if (!nb.fontSize) nb.fontSize = 'medium';
            nb.entries.forEach(entry => {
                if (!entry.images) entry.images = [];
                if (entry.weather === undefined) entry.weather = "";
                if (entry.isPublic === undefined) entry.isPublic = false;
            });
        });

        const nb = getCurrentNotebook();
        updateLabels(nb ? nb.isVertical : false);

        renderTabs();
        updateNotebookHeader();
        refreshSidebar();
        renderHistory();
        
        const currentEntries = getCurrentEntries();
        if (currentEntries.length > 0) {
            viewDiary(currentEntries[0].id);
        } else {
            showNewForm();
        }
    };

    // 閲覧専用デモモードの初期化。
    // 編集系UI(新規作成・削除・公開切替・一括操作・インポート/エクスポート・ノート追加/名前変更)は全て隠す。
    // 一方でノート切替・カレンダー・Recent Activityは「アプリの機能紹介」として残し、
    // public_entries.json (ノート単位でグループ化された公開エントリ)の範囲内で閲覧できるようにする。
    // 内部的には notebooks / currentNotebookId / currentSelectId など既存の変数をそのまま流用するが、
    // 通常編集モードの初期化(initDBなど)は一切呼ばないため、書き込み系の関数は使用しない。
    async function initReadOnlyDemo() {
        document.getElementById('newPostBtn').style.display = 'none';
        document.getElementById('bulkPublicActions').style.display = 'none';
        document.querySelector('.settings-group').style.display = 'none';
        document.querySelector('.theme-selector-wrapper').style.display = 'none';
        // 件数選択(SHOW)は編集画面のみの機能のため、公開ページ側では表示しない(ページ送り自体は表示する)
        document.querySelector('.index-page-size-row').style.display = 'none';
        document.getElementById('indexHeader').innerText = 'Index';
        document.getElementById('activityHeader').innerText = 'Recent Activity';
        document.getElementById('calendarHeader').innerText = 'Calendar';

        // 公開ページではノートタイトルを表示せず、その位置を「お知らせ」欄として使う
        document.getElementById('currentNotebookTitle').style.display = 'none';

        // カレンダーのナビゲーションボタンを、デモ専用の(書き込みを行わない)ハンドラに差し替える
        document.getElementById('calendarPrevBtn').onclick = () => moveDemoCalendar(-1);
        document.getElementById('calendarNextBtn').onclick = () => moveDemoCalendar(1);
        document.getElementById('todayBtn').onclick = jumpToDemoToday;

        let announcement = null;
        try {
            // 公開デモデータは、コード(このリポジトリ)とは別の diary-content リポジトリで管理する。
            // アプリ本体をフォーク・ダウンロードした人に、puipui個人のデータが同梱されないようにするため。
            const PUBLIC_CONTENT_URL = 'https://raw.githubusercontent.com/ocoe-puipui/diary-content/main/public_entries.json';
            const res = await fetch(PUBLIC_CONTENT_URL, { cache: 'no-store' });
            if (res.ok) {
                const data = await res.json();
                notebooks = data.notebooks || [];
                announcement = data.announcement || null;
            } else {
                notebooks = [];
            }
        } catch (err) {
            notebooks = [];
        }

        // お知らせは、公開エントリの有無に関わらず常に表示する
        const announcementEl = document.getElementById('announcementContent');
        if (announcement && (announcement.content || (announcement.images && announcement.images.length > 0))) {
            announcementEl.innerHTML = composeAnnouncementHtml(announcement);
            announcementEl.style.display = 'block';
            document.querySelector('.notebook-header-panel').style.display = '';
        } else {
            announcementEl.style.display = 'none';
            document.querySelector('.notebook-header-panel').style.display = 'none';
        }

        if (notebooks.length === 0) {
            // 公開エントリが無い場合のみ、右カラム(Calendar/Recent Activity)を隠して2カラム表示にする
            document.querySelector('.container').classList.add('demo-mode');
            document.querySelector('.notebook-tabs-container').style.display = 'none';
            document.getElementById('sidebarRightPanel').style.display = 'none';
            document.getElementById('indexList').innerHTML = `<li style="color:var(--text-muted);font-size:0.9rem;font-weight:600;padding:10px 0;text-align:center;">公開されている日記はまだありません。</li>`;
            document.getElementById('mainPanel').innerHTML = `<div style="text-align:center; padding:50px; font-weight:600; color:var(--text-muted);">公開されている日記はまだありません。</div>`;
            return;
        }

        currentNotebookId = notebooks[0].id;
        switchDemoNotebook(currentNotebookId);
    }

    function getDemoNotebook() { return notebooks.find(n => n.id === currentNotebookId); }
    function getDemoEntries() { const nb = getDemoNotebook(); return nb ? nb.entries : []; }

    // ノート切替専用(追加・削除・リネームボタンは持たせない)
    function renderDemoTabs() {
        const container = document.getElementById('notebookTabs');
        container.innerHTML = '';
        notebooks.forEach(nb => {
            const btn = document.createElement('button');
            btn.className = `notebook-tab ${nb.id === currentNotebookId ? 'active' : ''}`;
            const textSpan = document.createElement('span');
            textSpan.className = 'notebook-tab-text';
            textSpan.innerText = nb.name;
            textSpan.onclick = () => switchDemoNotebook(nb.id);
            btn.appendChild(textSpan);
            container.appendChild(btn);
        });
    }

    function switchDemoNotebook(id) {
        currentNotebookId = id;
        currentSelectId = null;
        indexPageOffset = 0;
        const nb = getDemoNotebook();
        if (!nb) return;
        applyTheme(nb.theme);
        renderDemoTabs();
        renderDemoCalendar();
        renderDemoActivity();
        const entries = getDemoEntries();
        if (entries.length === 0) {
            refreshDemoSidebar();
            document.getElementById('mainPanel').innerHTML = `<div style="text-align:center; padding:50px; font-weight:600; color:var(--text-muted);">このノートにはまだ公開されている日記はありません。</div>`;
            document.getElementById('mainPanelEntryNav').innerHTML = '';
        } else if (mainViewMode === 'feed') {
            refreshDemoSidebar();
            renderDemoEntryFeed();
        } else {
            viewDemoEntry(entries[0].id);
        }
    }

    function refreshDemoSidebar() {
        const indexList = document.getElementById('indexList');
        indexList.innerHTML = '';
        const entries = getDemoEntries();
        if (entries.length === 0) {

    function renderDemoCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const dateObj = new Date(calendarYear, calendarMonth, 1);
        document.getElementById('calendarEra').innerText = new Intl.DateTimeFormat('ja-JP-u-ca-japanese', { year: 'numeric' }).format(dateObj);
        document.getElementById('calendarWestern').innerText = `${calendarYear}.${String(calendarMonth + 1).padStart(2, '0')}`;

        ['日', '月', '火', '水', '木', '金', '土'].forEach(d => {
            const label = document.createElement('div'); label.className = 'calendar-day-label'; label.innerText = d; grid.appendChild(label);
        });

        const firstDayIdx = new Date(calendarYear, calendarMonth, 1).getDay();
        const lastDate = new Date(calendarYear, calendarMonth + 1, 0).getDate();
        const prevLastDate = new Date(calendarYear, calendarMonth, 0).getDate();

        for (let i = firstDayIdx - 1; i >= 0; i--) {
            const cell = document.createElement('div'); cell.className = 'calendar-cell'; cell.innerText = prevLastDate - i; grid.appendChild(cell);
        }

        const entries = getDemoEntries();
        let activeDateString = "";
        if (currentSelectId) {
            const activeEntry = entries.find(e => e.id === currentSelectId);
            if (activeEntry) activeDateString = activeEntry.date;
        }

        for (let date = 1; date <= lastDate; date++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell current-month';
            cell.innerText = date;
            const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;

            const foundEntry = entries.find(e => e.date === dateStr);
            if (foundEntry) {
                cell.classList.add('has-diary');
                cell.onclick = () => viewDemoEntry(foundEntry.id);
            }
            if (dateStr === activeDateString) cell.classList.add('is-active');

            grid.appendChild(cell);
        }

        const totalCells = firstDayIdx + lastDate;
        const nextMonthCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
        for (let i = 1; i <= nextMonthCells; i++) {
            const cell = document.createElement('div'); cell.className = 'calendar-cell'; cell.innerText = i; grid.appendChild(cell);
        }
    }

    function manageNotebookPrompt(id) {
        const nb = notebooks.find(n => n.id === id);
        if (!nb) return;
        const action = prompt(`【${nb.name}】の管理 / Manage "${nb.name}"\n\n1: 名前を変更する / Rename\n2: この日記帳を丸ごと削除する / Delete this diary\n\n番号を入力してください / Enter a number:`, "1");
        if (action === "1") {
            const newName = prompt("新しい日記の名前を入力してください:\nEnter a new name for this diary:", nb.name);
            if (newName && newName.trim() !== "") {
                nb.name = newName.trim();
                saveAllData(); renderTabs(); updateNotebookHeader(); renderHistory();
            }
        } else if (action === "2") {
            if (notebooks.length <= 1) { alert("これ以上日記帳を削除することはできません。\nYou cannot delete the last remaining diary."); return; }
            if (confirm(`本当に「${nb.name}」を削除しますか？\nAre you sure you want to delete "${nb.name}"?`)) {
                notebooks = notebooks.filter(n => n.id !== id);
                if (currentNotebookId === id) currentNotebookId = notebooks[0].id;
                editHistory = editHistory.filter(h => h.notebookId !== id);
                saveAllData(); switchNotebook(currentNotebookId);
            }
        }
    }

    function formatJapaneseDate(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split('-');
        if (parts.length === 3) {
            const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            const formatter = new Intl.DateTimeFormat('ja-JP-u-ca-japanese', { year: 'numeric' });
            return `${formatter.format(dateObj)} ${parts[0]}/${parts[1]}/${parts[2]}`;
        }
        return dateStr;
    }

    function formatSlashDate(dateStr) {
        return dateStr ? dateStr.replace(/-/g, '/') : "";
    }

    function formatBytes(base64String) {
        if (!base64String) return "";
        const padding = (base64String.match(/=/g) || []).length;
        const sizeInBytes = (base64String.length * 3 / 4) - padding;
        if (sizeInBytes < 1024) return sizeInBytes + " B";
        else if (sizeInBytes < 1048576) return (sizeInBytes / 1024).toFixed(1) + " KB";
        else return (sizeInBytes / 1048576).toFixed(1) + " MB";
    }

            li.innerHTML = `
                <div class="index-row-top">
                    <span class="index-page-num">${formatSlashDate(entry.date)}</span>
                    <button type="button" class="public-toggle-btn ${entry.isPublic ? 'is-public' : ''}" title="${entry.isPublic ? '公開中(クリックで非公開に)' : '非公開(クリックで公開)'}" onclick="toggleEntryPublic(event, ${entry.id})">${entry.isPublic ? ICON_PUBLIC_ON : ICON_PUBLIC_OFF}</button>
                </div>
                <div class="index-row-bottom ${!entry.title ? 'empty-title' : ''}" title="${entry.title || labels['text-empty-title']}">${entry.title || labels['text-empty-title']}</div>
            `;
            li.onclick = () => viewDiary(entry.id);
            indexList.appendChild(li);
        });

        renderIndexPageNav(totalPages);
    }

    function renderIndexPageNav(totalPages) {
        const statusHtml = `<span class="index-page-status">${indexPageOffset + 1} / ${totalPages}</span>`;
        const navHtml = totalPages <= 1 ? '' : `
            <button type="button" onclick="moveIndexPage(-1)" ${indexPageOffset <= 0 ? 'disabled' : ''} aria-label="previous">◀</button>
            ${statusHtml}
            <button type="button" onclick="moveIndexPage(1)" ${indexPageOffset >= totalPages - 1 ? 'disabled' : ''} aria-label="next">▶</button>
        `;
        document.getElementById('indexPageNavTop').innerHTML = navHtml;
    }

    function moveIndexPage(direction) {
        indexPageOffset += direction;
        if (isLiveDemo) {
            refreshDemoSidebar();
            if (mainViewMode === 'feed') renderDemoEntryFeed();
        } else {
            refreshSidebar();
            if (mainViewMode === 'feed') renderEntryFeed();
        }
    }

    function changeIndexPageSize(size) {
        indexPageSize = parseInt(size, 10) || 5;
        indexPageOffset = 0;
        refreshSidebar();
        if (mainViewMode === 'feed') renderEntryFeed();
    }

    // 「1件詳細表示」⇔「ページ単位でまとめて表示」を切り替える
    function toggleMainViewMode() {
        mainViewMode = (mainViewMode === 'single') ? 'feed' : 'single';
        updateViewModeBtnText();
        if (currentSelectId) {
            viewDiary(currentSelectId);
        } else {
            const entries = getCurrentEntries();
            if (entries.length > 0) viewDiary(entries[0].id); else showNewForm();
        }
    }

    // 指定したエントリーが含まれるページへ、現在のページ位置(indexPageOffset)を合わせる
    function ensurePageContainsEntry(id) {
        const entries = getCurrentEntries();
        const idx = entries.findIndex(e => e.id === id);
        if (idx === -1) return;
        indexPageOffset = Math.floor(idx / indexPageSize);
    }

    // 現在のページに含まれる複数エントリーを、新しいものから順にまとめて表示する
    function renderEntryFeed() {
        const nb = getCurrentNotebook();
        const entries = getCurrentEntries();
        if (entries.length === 0) { showNewForm(); return; }

        const totalPages = Math.max(1, Math.ceil(entries.length / indexPageSize));
        if (indexPageOffset > totalPages - 1) indexPageOffset = totalPages - 1;
        if (indexPageOffset < 0) indexPageOffset = 0;
        const startIdx = indexPageOffset * indexPageSize;
        const pageEntries = entries.slice(startIdx, startIdx + indexPageSize);

        const fontSizeClass = `fontsize-${(nb && nb.fontSize) || 'medium'}`;
        let html = `<div class="entry-view-wrapper ${fontSizeClass}">`;
        pageEntries.forEach(entry => {
            let galleryHtml = '';
            if (entry.images && entry.images.length > 0) {
                galleryHtml = '<div class="diary-view-gallery">';
                entry.images.forEach(imgObj => {
                    galleryHtml += `<div class="diary-view-image-wrapper"><img src="${imgObj.data}"><div style="text-align:right;"><span class="file-size-badge">Size: ${formatBytes(imgObj.data)}</span></div></div>`;
                });
                galleryHtml += '</div>';
            }
            html += `
                <div class="feed-entry-block">
                    ${entry.title ? `<div class="diary-view-title">${entry.title}</div>` : ''}
                    <div class="diary-view-header ${nb && nb.isVertical ? 'vertical' : ''}">
                        <div>🗓️ ${formatJapaneseDate(entry.date)}</div>
                        ${entry.weather ? `<div>${entry.weather}</div>` : ''}
                    </div>
                    ${galleryHtml}
                    <div class="diary-view-text ${nb && nb.isVertical ? 'vertical' : ''}">${entry.content}</div>
                    <div class="action-buttons">
                        <button class="edit-entry-btn" onclick="showEditForm(${entry.id})">${labels['btn-edit-entry']}</button>
                        <button class="delete-btn" onclick="deleteEntry(${entry.id})">${labels['btn-delete']}</button>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById('mainPanel').innerHTML = html;

        const statusHtml = `<span class="index-page-status">${indexPageOffset + 1} / ${totalPages}</span>`;
        const navHtml = totalPages <= 1 ? '' : `
            <button type="button" onclick="moveIndexPage(-1)" ${indexPageOffset <= 0 ? 'disabled' : ''} aria-label="previous">◀</button>
            ${statusHtml}
            <button type="button" onclick="moveIndexPage(1)" ${indexPageOffset >= totalPages - 1 ? 'disabled' : ''} aria-label="next">▶</button>
        `;
        document.getElementById('mainPanelEntryNav').innerHTML = navHtml;
    }

    // 現在開いているノート(タブ)内の全エントリを一括で公開/非公開に切り替える。
    // 個別のエントリは、この一括操作の後でも🌐ボタンで個別にオン/オフし直せる。
    function bulkSetPublic(makePublic) {
        const nb = getCurrentNotebook(); if (!nb) return;
        if (nb.entries.length === 0) return;
        const msg = makePublic
            ? `「${nb.name}」内の全${nb.entries.length}件を公開にします。よろしいですか？`
            : `「${nb.name}」内の全${nb.entries.length}件を非公開にします。よろしいですか？`;
        if (!confirm(msg)) return;
        nb.entries.forEach(entry => { entry.isPublic = makePublic; });
        saveAllData();
        refreshSidebar();
        const checkbox = document.getElementById('diaryIsPublic');
        if (checkbox && currentSelectId) checkbox.checked = makePublic;
    }

    function toggleEntryPublic(event, id) {
        event.stopPropagation();
        const nb = getCurrentNotebook(); if (!nb) return;
        const entry = nb.entries.find(e => e.id === id); if (!entry) return;
        entry.isPublic = !entry.isPublic;
        saveAllData();
        refreshSidebar();
        // 現在編集フォームを開いている対象と同じ場合はチェックボックスも同期する
        if (currentSelectId === id) {
            const checkbox = document.getElementById('diaryIsPublic');
            if (checkbox) checkbox.checked = entry.isPublic;
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const dateObj = new Date(calendarYear, calendarMonth, 1);
        document.getElementById('calendarEra').innerText = new Intl.DateTimeFormat('ja-JP-u-ca-japanese', { year: 'numeric' }).format(dateObj);
        document.getElementById('calendarWestern').innerText = `${calendarYear}.${String(calendarMonth + 1).padStart(2, '0')}`;

        ['日', '月', '火', '水', '木', '金', '土'].forEach(d => {
            const label = document.createElement('div'); label.className = 'calendar-day-label'; label.innerText = d; grid.appendChild(label);
        });

        const firstDayIdx = new Date(calendarYear, calendarMonth, 1).getDay();
        const lastDate = new Date(calendarYear, calendarMonth + 1, 0).getDate();
        const prevLastDate = new Date(calendarYear, calendarMonth, 0).getDate();

        for (let i = firstDayIdx - 1; i >= 0; i--) {
            const cell = document.createElement('div'); cell.className = 'calendar-cell'; cell.innerText = prevLastDate - i; grid.appendChild(cell);
        }

        let activeDateString = currentFormDate || "";
        const currentEntries = getCurrentEntries();
        if (currentSelectId) {
            const activeEntry = currentEntries.find(e => e.id === currentSelectId);
            if (activeEntry) activeDateString = activeEntry.date;
        }

        for (let date = 1; date <= lastDate; date++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell current-month';
            cell.innerText = date;
            const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
            
            const foundEntry = currentEntries.find(e => e.date === dateStr);
            if (foundEntry) cell.classList.add('has-diary');
            if (dateStr === activeDateString) cell.classList.add('is-active');

            cell.onclick = () => { if (foundEntry) viewDiary(foundEntry.id); else showNewForm(dateStr); };
            grid.appendChild(cell);
        }

        const totalCells = firstDayIdx + lastDate;
        const nextMonthCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
        for (let i = 1; i <= nextMonthCells; i++) {
            const cell = document.createElement('div'); cell.className = 'calendar-cell'; cell.innerText = i; grid.appendChild(cell);
        }
    }

    function moveCalendar(direction) {
        calendarMonth += direction;
        if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
        if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
        renderCalendar();
    }

    function jumpToToday() {
        const today = new Date(); calendarYear = today.getFullYear(); calendarMonth = today.getMonth();
        const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const found = getCurrentEntries().find(e => e.date === dateStr);
        if (found) viewDiary(found.id); else showNewForm(dateStr);
    }

    function viewDiary(id) {
        currentSelectId = id; currentFormDate = null;
        const nb = getCurrentNotebook();
        const entry = getCurrentEntries().find(e => e.id === id);
        if (!entry) { showNewForm(); return; }

        updateLabels(nb ? nb.isVertical : false);
        renderTabs();
        syncCalendarMonth(entry.date);

        if (mainViewMode === 'feed') {
            ensurePageContainsEntry(id);
            refreshSidebar();
            renderEntryFeed();
            return;
        }
        refreshSidebar();

        let galleryHtml = '';
        if (entry.images && entry.images.length > 0) {
            galleryHtml = '<div class="diary-view-gallery">';
            entry.images.forEach(imgObj => {
                galleryHtml += `<div class="diary-view-image-wrapper"><img src="${imgObj.data}"><div style="text-align:right;"><span class="file-size-badge">Size: ${formatBytes(imgObj.data)}</span></div></div>`;
            });
            galleryHtml += '</div>';
        }

        const fontSizeClass = `fontsize-${(nb && nb.fontSize) || 'medium'}`;
        document.getElementById('mainPanel').innerHTML = `
            <div class="entry-view-wrapper ${fontSizeClass}">
                ${entry.title ? `<div class="diary-view-title">${entry.title}</div>` : ''}
                <div class="diary-view-header ${nb && nb.isVertical ? 'vertical' : ''}">
                    <div>🗓️ ${formatJapaneseDate(entry.date)}</div>
                    ${entry.weather ? `<div>${entry.weather}</div>` : ''}
                </div>
                ${galleryHtml}
                <div class="diary-view-text ${nb && nb.isVertical ? 'vertical' : ''}">${entry.content}</div>
                <div class="action-buttons">
                    <button class="edit-entry-btn" onclick="showEditForm(${entry.id})">${labels['btn-edit-entry']}</button>
                    <button class="delete-btn" onclick="deleteEntry(${entry.id})">${labels['btn-delete']}</button>
                </div>
            </div>
        `;
        document.getElementById('mainPanelEntryNav').innerHTML = buildEntryNavHtml(getCurrentEntries(), id, 'viewDiary');
    }

    // エントリー一覧(日付降順)の中で、現在のエントリーの前後へ移動するナビを生成する。
    // navFnName は移動先で呼び出す関数名("viewDiary" または "viewDemoEntry")を指定する。
    function buildEntryNavHtml(entriesList, currentId, navFnName) {
        const idx = entriesList.findIndex(e => e.id === currentId);
        if (idx === -1 || entriesList.length <= 1) return '';
        const newerEntry = idx > 0 ? entriesList[idx - 1] : null;
        const olderEntry = idx < entriesList.length - 1 ? entriesList[idx + 1] : null;
        const olderId = typeof olderEntry?.id === 'string' ? `'${olderEntry.id}'` : olderEntry?.id;
        const newerId = typeof newerEntry?.id === 'string' ? `'${newerEntry.id}'` : newerEntry?.id;
        return `
            <div class="entry-nav">
                <button type="button" ${olderEntry ? `onclick="${navFnName}(${olderId})"` : 'disabled'} aria-label="previous">◀</button>
                <button type="button" ${newerEntry ? `onclick="${navFnName}(${newerId})"` : 'disabled'} aria-label="next">▶</button>
            </div>
        `;
    }

    function handleWeatherSelection(selectEl, textInputId) {
        const input = document.getElementById(textInputId);
        if (selectEl.value === "__custom__") { input.value = ""; input.style.display = "block"; input.focus(); }
        else { input.value = selectEl.value; input.style.display = "none"; }
    }

    function generateWeatherTemplate(currentWeather = "", textInputId = "diaryWeatherCustom", selectId = "diaryWeatherSelect") {
        const presets = ["", "☀️", "☁️", "☔", "☃️", "🌤️", "⛈️", "🌀", "🌫️ ", "🌡️", "🍃"];
        const isPreset = presets.includes(currentWeather);
        let selectHtml = `<select id="${selectId}" onchange="handleWeatherSelection(this, '${textInputId}')">`;
        presets.forEach(p => { selectHtml += `<option value="${p}" ${isPreset && currentWeather === p ? "selected" : ""}>${p === "" ? "   " : p}</option>`; });
        selectHtml += `<option value="__custom__" ${!isPreset && currentWeather !== "" ? "selected" : ""}>${labels['text-custom-weather']}</option></select>`;
        return `<div class="weather-input-container">${selectHtml}<input type="text" id="${textInputId}" value="${currentWeather}" placeholder="${labels['text-weather-placeholder']}" style="${!isPreset && currentWeather !== "" ? "display:block;" : "display:none;"}"></div>`;
    }

    function showNewForm(targetDateStr = null) {
        currentSelectId = null; tempImagesArray = [];
        const finalDateStr = targetDateStr || new Date().toISOString().substring(0, 10);
        currentFormDate = finalDateStr;
        refreshSidebar(); syncCalendarMonth(finalDateStr);
        document.getElementById('mainPanelEntryNav').innerHTML = '';

        document.getElementById('mainPanel').innerHTML = `
            <h2>New Entry</h2>
            <form id="diaryForm" onsubmit="saveNewDiary(event)">
                <div class="form-group"><span class="editable-label">${labels['lbl-date']}</span><input type="date" id="diaryDate" value="${finalDateStr}" required onchange="onFormDateChange(this.value)"></div>
                <div class="form-group"><span class="editable-label">${labels['lbl-title']}</span><input type="text" id="diaryTitle" placeholder="${labels['text-optional']}"></div>
                <div class="form-group"><span class="editable-label">${labels['lbl-weather']}</span>${generateWeatherTemplate("")}</div>
                <div class="form-group">
                    <span class="editable-label">${labels['lbl-image']}</span><span class="form-note">${labels['text-form-note']}</span>
                    <div class="image-preview-area" onclick="document.getElementById('diaryImage').click()"><span>${labels['text-click-image']}</span></div>
                    <input type="file" id="diaryImage" accept="image/*" multiple style="display: none;" onchange="handleFileSelectMulti()">
                    <div class="form-images-grid" id="formImagesGrid"></div>
                </div>
                <div class="form-group"><span class="editable-label">${labels['lbl-content']}</span><textarea id="diaryContent" placeholder="${labels['text-content-placeholder']}" required></textarea></div>
                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" id="diaryIsPublic" style="width:auto;">
                        <span class="editable-label" style="margin-bottom:0;">${labels['lbl-public']}</span>
                    </label>
                </div>
                <button type="submit">${labels['btn-save-new']}</button>
            </form>
        `;
    }

    function showEditForm(id) {
        const entry = getCurrentEntries().find(e => e.id === id);
        if (!entry) return;
        tempImagesArray = entry.images ? [...entry.images] : [];
        currentFormDate = entry.date;
        document.getElementById('mainPanelEntryNav').innerHTML = '';

        document.getElementById('mainPanel').innerHTML = `
            <h2>Edit Entry</h2>
            <form id="diaryForm" onsubmit="saveEditDiary(event, ${id})">
                <div class="form-group"><span class="editable-label">${labels['lbl-date']}</span><input type="date" id="diaryDate" value="${entry.date}" required onchange="onFormDateChange(this.value)"></div>
                <div class="form-group"><span class="editable-label">${labels['lbl-title']}</span><input type="text" id="diaryTitle" value="${entry.title || ''}"></div>
                <div class="form-group"><span class="editable-label">${labels['lbl-weather']}</span>${generateWeatherTemplate(entry.weather || "")}</div>
                <div class="form-group">
                    <span class="editable-label">${labels['lbl-image']}</span>
                    <div class="image-preview-area" onclick="document.getElementById('diaryImage').click()"><span>${labels['text-click-image']}</span></div>
                    <input type="file" id="diaryImage" accept="image/*" multiple style="display: none;" onchange="handleFileSelectMulti()">
                    <div class="form-images-grid" id="formImagesGrid"></div>
                </div>
                <div class="form-group"><span class="editable-label">${labels['lbl-content']}</span><textarea id="diaryContent" required>${entry.content}</textarea></div>
                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" id="diaryIsPublic" ${entry.isPublic ? 'checked' : ''} style="width:auto;">
                        <span class="editable-label" style="margin-bottom:0;">${labels['lbl-public']}</span>
                    </label>
                </div>
                <div class="action-buttons" style="border:none; padding:0; margin:0;">
                    <button type="submit">${labels['btn-save-edit']}</button>
                    <button type="button" class="delete-btn" style="padding:12px 20px;" onclick="viewDiary(${id})">${labels['btn-cancel']}</button>
                </div>
            </form>
        `;
        renderFormImagesGrid();
    }

    // 個々の日記エントリーとは独立した「お知らせ」欄。公開ページの上段(ヘッダー部分)に、
    // どのノート/エントリーを見ていても常に表示される紹介文・リンク・画像などを設定できる。
    // 入力はHTMLをそのまま受け付ける(編集できるのはこのアプリの所有者本人のみのため)。
    function showAnnouncementForm() {
        document.getElementById('mainPanelEntryNav').innerHTML = '';
        announcementTempImages = [...(siteAnnouncement.images || [])];
        document.getElementById('mainPanel').innerHTML = `
            <h2>お知らせ設定</h2>
            <form id="announcementForm" onsubmit="saveAnnouncement(event)">
                <div class="form-group">
                    <span class="editable-label">説明文(HTML)</span>
                    <textarea id="announcementContentInput" style="height:220px;">${siteAnnouncement.content || ''}</textarea>
                </div>
                <div class="form-group">
                    <div class="announcement-image-btn-row">
                        <label class="file-input-label">
                            <span>画像を選択して挿入（１）</span>
                            <input type="file" accept="image/*" style="display:none;" onchange="handleAnnouncementImageSelect(this)">
                        </label>
                        <label class="file-input-label">
                            <span>画像を選択して挿入（２）</span>
                            <input type="file" accept="image/*" style="display:none;" onchange="handleAnnouncementImageSelect(this)">
                        </label>
                        <label class="file-input-label">
                            <span>画像を選択して挿入（３）</span>
                            <input type="file" accept="image/*" style="display:none;" onchange="handleAnnouncementImageSelect(this)">
                        </label>
                    </div>
                    <div class="form-images-grid" id="announcementImagesGrid"></div>
                </div>
                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" id="announcementIsPublic" ${siteAnnouncement.isPublic ? 'checked' : ''} style="width:auto;">
                        <span class="editable-label" style="margin-bottom:0;">このお知らせを公開する</span>
                    </label>
                </div>
                <div class="action-buttons" style="border:none; padding:0; margin:0;">
                    <button type="submit">保存する</button>
                    <button type="button" class="delete-btn" style="padding:12px 20px;" onclick="currentSelectId ? viewDiary(currentSelectId) : showNewForm()">キャンセル</button>
                </div>
            </form>
        `;
        renderAnnouncementImagesGrid();
    }

    // お知らせの画像は本文(HTML)とは別の配列で管理する(日記の画像添付と同じ方式)。
    // 本文のテキストエリアに巨大なbase64文字列が入らないため、編集画面を開いても固まらない。
    function handleAnnouncementImageSelect(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            announcementTempImages.push({ id: Date.now() + Math.random(), data: reader.result });
            renderAnnouncementImagesGrid();
        };
        reader.readAsDataURL(file);
        input.value = '';
    }

    function renderAnnouncementImagesGrid() {
        const grid = document.getElementById('announcementImagesGrid'); if (!grid) return; grid.innerHTML = '';
        announcementTempImages.forEach(img => {
            const div = document.createElement('div'); div.className = 'form-image-item';
            div.innerHTML = `<img src="${img.data}"><span class="file-size-badge">${formatBytes(img.data)}</span><button type="button" class="delete-btn" style="margin-top:5px; padding:4px; font-size:0.75rem; width:100%;" onclick="removeAnnouncementImage(${img.id})">Remove</button>`;
            grid.appendChild(div);
        });
    }

    function removeAnnouncementImage(id) {
        announcementTempImages = announcementTempImages.filter(img => img.id !== id);
        renderAnnouncementImagesGrid();
    }

    async function saveAnnouncement(e) {
        e.preventDefault();
        siteAnnouncement = {
            content: document.getElementById('announcementContentInput').value,
            images: announcementTempImages,
            isPublic: document.getElementById('announcementIsPublic').checked
        };
        await setDBValue("site_announcement", siteAnnouncement);
        alert("✅ お知らせを保存しました。");
        renderAnnouncementPreview();
        if (currentSelectId) viewDiary(currentSelectId); else showNewForm();
    }

    function onFormDateChange(val) { currentFormDate = val; syncCalendarMonth(val); }
    function handleFileSelectMulti() {
        const files = document.getElementById('diaryImage').files; if (!files || files.length === 0) return;
        let loaded = 0;
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onloadend = function() {
                tempImagesArray.push({ id: Date.now() + Math.random(), data: reader.result });
                if (++loaded === files.length) { renderFormImagesGrid(); document.getElementById('diaryImage').value = ""; }
            };
            reader.readAsDataURL(file);
        });
    }

    function renderFormImagesGrid() {
        const grid = document.getElementById('formImagesGrid'); if (!grid) return; grid.innerHTML = '';
        tempImagesArray.forEach(img => {
            const div = document.createElement('div'); div.className = 'form-image-item';
            div.innerHTML = `<img src="${img.data}"><span class="file-size-badge">${formatBytes(img.data)}</span><button type="button" class="delete-btn" style="margin-top:5px; padding:4px; font-size:0.75rem; width:100%;" onclick="removeFormImage(${img.id})">Remove</button>`;
            grid.appendChild(div);
        });
    }

    function removeFormImage(id) { tempImagesArray = tempImagesArray.filter(img => img.id !== id); renderFormImagesGrid(); }

    function saveNewDiary(e) {
        e.preventDefault(); const nb = getCurrentNotebook(); if (!nb) return;
        const entry = { id: Date.now(), date: document.getElementById('diaryDate').value, title: document.getElementById('diaryTitle').value.trim(), weather: document.getElementById('diaryWeatherCustom').value.trim(), images: tempImagesArray, content: document.getElementById('diaryContent').value, isPublic: document.getElementById('diaryIsPublic').checked };
        nb.entries.unshift(entry); nb.entries.sort((a,b) => new Date(b.date) - new Date(a.date));
        pushToHistory(nb.id, nb.name, entry.id, entry.date, entry.title); viewDiary(entry.id);
    }

    function saveEditDiary(e, id) {
        e.preventDefault(); const nb = getCurrentNotebook();
        const entry = nb.entries.find(e => e.id === id); if (!entry) return;
        entry.date = document.getElementById('diaryDate').value; entry.title = document.getElementById('diaryTitle').value.trim(); entry.weather = document.getElementById('diaryWeatherCustom').value.trim(); entry.content = document.getElementById('diaryContent').value; entry.images = tempImagesArray; entry.isPublic = document.getElementById('diaryIsPublic').checked;
        nb.entries.sort((a,b) => new Date(b.date) - new Date(a.date));
        pushToHistory(nb.id, nb.name, entry.id, entry.date, entry.title); viewDiary(id);
    }

    function deleteEntry(id) {
        if (confirm('削除してもよろしいですか？')) {
            const nb = getCurrentNotebook();
            nb.entries = nb.entries.filter(e => e.id !== id);
            editHistory = editHistory.filter(h => !(h.notebookId === currentNotebookId && h.entryId === id));
            saveAllData(); renderHistory();
            if (nb.entries.length > 0) viewDiary(nb.entries[0].id); else showNewForm();
        }
    }

    function exportData() {
        const blob = new Blob([JSON.stringify({ version: "3.1", notebooks: notebooks, editHistory: editHistory, siteAnnouncement: siteAnnouncement }, null, 2)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `chronicle_db_backup_${new Date().toISOString().substring(0, 10)}.json`;
        a.click();
    }

    // 公開マークが付いたエントリだけを、所属ノート単位でグループ化して公開ページ用のJSONとして書き出す。
    // ノート名・テーマ・縦書き/横書きの情報も保持することで、公開ページ側でもノート切替機能を再現できるようにする。
    // 公開エントリが1件もないノートは書き出し対象から除外する。
    // 書き出したファイルは手動で public_entries.json としてリポジトリに配置・コミットする運用。
    function exportPublicData() {
        const pubNotebooks = [];
        notebooks.forEach(nb => {
            const pubEntries = nb.entries
                .filter(entry => entry.isPublic)
                .map(entry => ({
                    id: 'pub_' + entry.id,
                    date: entry.date,
                    title: entry.title || '',
                    content: entry.content || '',
                    weather: entry.weather || '',
                    images: (entry.images || []).map(img => (typeof img === 'string' ? img : img.data))
                }));
            if (pubEntries.length === 0) return;
            pubEntries.sort((a, b) => new Date(b.date) - new Date(a.date));
            pubNotebooks.push({
                id: 'pub_' + nb.id,
                name: nb.name,
                theme: nb.theme || 'theme-classic',
                isVertical: !!nb.isVertical,
                fontSize: nb.fontSize || 'medium',
                entries: pubEntries
            });
        });

        const payload = {
            version: "2.2",
            updatedAt: new Date().toISOString().substring(0, 10),
            announcement: siteAnnouncement.isPublic
                ? {
                    content: siteAnnouncement.content || '',
                    images: (siteAnnouncement.images || []).map(img => (typeof img === 'string' ? img : img.data))
                }
                : null,
            notebooks: pubNotebooks
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `public_entries.json`;
        a.click();
    }

    // 現在開いているノートだけを書き出す(画像・公開フラグを含む全項目)。
    // 別のノートへ「まとめて追加インポート」する用途を想定した、ノート単位のバックアップ機能。
    function exportNotebookData() {
        const nb = getCurrentNotebook(); if (!nb) return;
        const payload = {
            version: "1.0",
            type: "chronicle_notebook_export",
            notebookName: nb.name,
            isVertical: !!nb.isVertical,
            exportedAt: new Date().toISOString().substring(0, 10),
            entries: nb.entries
        };
        const safeName = (nb.name || 'notebook').replace(/[\\/:*?"<>|]/g, '_');
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `chronicle_notebook_${safeName}_${payload.exportedAt}.json`;
        a.click();
    }

    // ノート単位で書き出したファイルを、現在開いているノートに「追加」する形で読み込む。
    // 既存のエントリーは削除・上書きされない。IDの重複を避けるため新しいIDを振り直す。
    async function importNotebookData(input) {
        const file = input.files[0]; if (!file) return;
        const nb = getCurrentNotebook();
        if (!nb) { input.value = ""; return; }

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                const importedEntries = parsed.entries;
                if (!Array.isArray(importedEntries)) {
                    alert("非対応のファイル構造です。「export this notebook」で書き出したファイルを選択してください。");
                    input.value = ""; return;
                }
                if (!confirm(`現在のノート「${nb.name}」に、${importedEntries.length}件のエントリーを追加します。既存のエントリーは削除されません。よろしいですか？`)) {
                    input.value = ""; return;
                }

                importedEntries.forEach((entry, i) => {
                    nb.entries.push({
                        id: Date.now() + i,
                        date: entry.date,
                        title: entry.title || '',
                        content: entry.content || '',
                        weather: entry.weather || '',
                        images: entry.images || [],
                        isPublic: !!entry.isPublic
                    });
                });
                nb.entries.sort((a, b) => new Date(b.date) - new Date(a.date));

                await saveAllData();
                refreshSidebar(); renderCalendar();
                if (nb.entries.length > 0) viewDiary(nb.entries[0].id);

                alert(`✅ ${importedEntries.length}件のエントリーを追加しました。`);
            } catch (err) {
                alert("インポート失敗: " + err.message);
            }
            input.value = "";
        };
        reader.readAsText(file);
    }

    async function importData(input) {
        const file = input.files[0]; if (!file) return;
        if (!confirm("データを読み込みますか？現在のデータは上書き・消去されます。")) { input.value = ""; return; }

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                let loadedNotebooks = [];
                let loadedHistory = [];

                if (parsed.notebooks) {
                    loadedNotebooks = parsed.notebooks;
                    loadedHistory = parsed.editHistory || [];
                } else if (parsed.DIARY || parsed.日誌) {
                    if (parsed.DIARY) {
                        loadedNotebooks.push({
                            id: "nb_diary_sample", name: "DIARY", theme: "theme-classic", isVertical: false,
                            entries: parsed.DIARY.map((x, i) => ({ id: Date.now() + i, date: x.date, title: x.title, weather: "", images: [], content: x.content }))
                        });
                    }
                    if (parsed.日誌) {
                        loadedNotebooks.push({
                            id: "nb_nishi_sample", name: "日誌", theme: "theme-purple", isVertical: true,
                            entries: parsed.日誌.map((x, i) => ({ id: Date.now() + 10 + i, date: x.date, title: x.title, weather: "", images: [], content: x.content }))
                        });
                    }
                } else {
                    alert("非対応のファイル構造です。"); return;
                }

                await clearDB();
                notebooks = loadedNotebooks;
                currentNotebookId = notebooks[0].id;
                editHistory = loadedHistory;
                if (parsed.siteAnnouncement) {
                    siteAnnouncement = parsed.siteAnnouncement;
                    if (!siteAnnouncement.images) siteAnnouncement.images = [];
                    const migrated = extractImagesFromAnnouncementContent(siteAnnouncement.content || '');
                    if (migrated.images.length > 0) {
                        siteAnnouncement.content = migrated.text;
                        siteAnnouncement.images = [...siteAnnouncement.images, ...migrated.images];
                    }
                    await setDBValue("site_announcement", siteAnnouncement);
                }

                await saveAllData();
                updateLabels(getCurrentNotebook()?.isVertical);
                renderTabs(); updateNotebookHeader(); refreshSidebar(); renderHistory();
                if (getCurrentEntries().length > 0) viewDiary(getCurrentEntries()[0].id); else showNewForm();
                
                alert("✅ データのインポートが完了しました！");
            } catch (err) {
                alert("インポート失敗: " + err.message);
            }
            input.value = "";
        };
        reader.readAsText(file);
    }
</script>
